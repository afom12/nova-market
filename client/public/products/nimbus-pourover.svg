<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ceramic pour-over coffee set">
  <rect width="800" height="600" fill="#EDEFF2"/>
  <ellipse cx="400" cy="500" rx="138" ry="18" fill="#1B2B40" opacity="0.07"/>
  <!-- carafe -->
  <path d="M312 330h176v108a50 50 0 0 1-50 50H362a50 50 0 0 1-50-50V330Z" fill="#32455E" opacity="0.28"/>
  <path d="M312 330h176v108a50 50 0 0 1-50 50H362a50 50 0 0 1-50-50V330Z" fill="none" stroke="#1B2B40" stroke-width="9"/>
